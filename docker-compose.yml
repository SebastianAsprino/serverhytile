services:
  hytale:
    image: ghcr.io/ginco-org/hytale-server:latest
    restart: unless-stopped
    stop_grace_period: 60s

    ports:
      - "5520:5520/udp"   # Hytale usa QUIC (UDP)

    environment:
      EULA: "true"
      MEMORY: "6G"        # 85 mods: 4G se queda corto
      AUTH_MODE: "authenticated"
      ENABLE_BACKUP: "true"
      BACKUP_FREQUENCY: "60"

    volumes:
      # Volumen con nombre: mundo, configs y tokens de auth. Sobrevive a los redeploys.
      - hytale-data:/data
      # Mods del repo: se copian a /data/mods en cada arranque.
      - ./mods:/mods:ro

    stdin_open: true
    tty: true

volumes:
  hytale-data:
